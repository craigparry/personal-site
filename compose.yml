services:
  # --- Backend Service (FastAPI) ---
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fastapi-alpine
    ports:
      - "8000:8000"
    environment:
      - ENV=production
    restart: always

  # --- Frontend Service (Next.js) ---
  frontend:
    build:
      context: ./personal-site
      dockerfile: Dockerfile
    container_name: personal-site
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend